name: Stamp version
description: Write the release version into shoebill_version in config/app.php. app.version stays 'canary' so Pelican's self-updater never replaces Shoebill

inputs:
  version:
    description: The version to stamp, with or without the leading v
    required: true

runs:
  using: composite
  steps:
    - name: Stamp version in config/app.php
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        VERSION="${VERSION#v}"
        if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
          echo "Invalid version '$VERSION', refusing to update config"
          exit 1
        fi
        sed -i -E "s|'shoebill_version' => '[^']*',|'shoebill_version' => '$VERSION',|" config/app.php
        if ! grep -qF "'shoebill_version' => '$VERSION'," config/app.php; then
          echo "Version stamp failed, config/app.php still does not contain '$VERSION'"
          exit 1
        fi

name: Bug Report
description: Something isn't working quite right in the software.
labels: [not confirmed]
body:
- type: markdown
  attributes:
    value: |
      Bug reports should only be used for reporting issues with how the software works. For help installing Shoebill or with dependencies, use [GitHub Discussions](https://github.com/yamashi8040-ai/Shoebill/discussions). Bugs that also happen on plain Pelican or Pterodactyl belong in their repositories.

- type: textarea
  attributes:
    label: Current Behavior
    description: Please provide a clear & concise description of the issue.
  validations:
    required: true

- type: textarea
  attributes:
    label: Expected Behavior
    description: Please describe what you expected to happen.
  validations:
    required: true

- type: textarea
  attributes:
    label: Steps to Reproduce
    description: Please be as detailed as possible when providing steps to reproduce, failure to provide steps will result in this issue being closed.
  validations:
    required: true

- type: input
  id: panel-version
  attributes:
    label: Panel Version
    description: Version number of your Panel (latest is not a version)
  validations:
    required: true

- type: input
  id: wings-version
  attributes:
    label: Wings Type and Version
    description: Pelican Wings or Pterodactyl Wings, and its version number (latest is not a version)
    placeholder: Pterodactyl Wings v1.11.13
  validations:
    required: true

- type: input
  id: egg-details
  attributes:
    label: Games and/or Eggs Affected
    description: Please include the specific game(s) or egg(s) you are running into this bug with.
    placeholder: Minecraft (Paper), Minecraft (Forge)

- type: input
  id: docker-image
  attributes:
    label: Docker Image
    description: The specific Docker image you are using for the game(s) above.
    placeholder: ghcr.io/pelican-eggs/yolks:java_17

- type: textarea
  id: panel-logs
  attributes:
    label: Error Logs
    description: |
      Paste the relevant lines (remove passwords, tokens and IP addresses first).
      Panel: `tail -n 300 /var/www/shoebill/storage/logs/laravel-$(date +%F).log`
      Wings: `sudo journalctl -u wings -n 200 --no-pager`
    render: bash
  validations:
    required: false

- type: checkboxes
  attributes:
    label: Is there an existing issue for this?
    description: Please [search here](https://github.com/yamashi8040-ai/Shoebill/issues) to see if an issue already exists for your problem.
    options:
    - label: I have searched the existing issues before opening this issue.
      required: true
    - label: I have provided all relevant details, including the specific game and Docker images I am using if this issue is related to running a server.
      required: true
    - label: I have read the README troubleshooting section and believe this is a bug in Shoebill, not a configuration issue with my system.
      required: true
